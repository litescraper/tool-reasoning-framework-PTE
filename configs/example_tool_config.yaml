tools:
  - class_name: "tools.search_tool.GoogleSearchTool"
    tool_schema:
      type: "function"
      function:
        name: "google_search"
        description: "Search the web using Google Search API"
        parameters:
          type: "object"
          properties:
            query:
              type: "string"
              description: "The search query"
          required:
            - query
    config: {}

  - class_name: "tools.visit_tool.VisitTool"
    tool_schema:
      type: "function"
      function:
        name: "visit_webpage"
        description: "Visit a webpage and extract relevant information based on user goal"
        parameters:
          type: "object"
          properties:
            url:
              type: "string"
              description: "The URL of the webpage to visit"
            goal:
              type: "string"
              description: "The goal or purpose of visiting this webpage"
          required:
            - url
            - goal
    config: {}

  - class_name: "tools.python_tool.PythonTool"
    tool_schema:
      type: "function"
      function:
        name: "python_executor"
        description: "Execute Python code in a sandboxed environment"
        parameters:
          type: "object"
          properties:
            code:
              type: "string"
              description: "The Python code to execute"
          required:
            - code
    config: {}

